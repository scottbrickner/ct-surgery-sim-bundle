# Netlify configuration — CT Surgery Sim Bundle (static assets only)
#
# This deploys the console, both monitors, the pacemaker, and their shared
# engine/scenarios/sync modules as plain static files - no build step, same
# as running serve.js locally. It does NOT deploy relay/server.js (that's a
# persistent Node/WebSocket process; Netlify's static hosting can't run it -
# see relay/README-deploy.md, target is Azure App Service).
#
# The CSP header below is reused verbatim from the pacemaker sim's own prior
# Netlify deploy (5392-netlify/netlify.toml, from before this bundle existed)
# per BUILD_PROMPT.md's "reuse the existing iframe CSP pattern" decision -
# not a fresh security review, a deliberate continuation of an already-agreed
# policy. Adjust the SharePoint/Microsoft domains below if Keck's tenant
# setup differs from what that prior deploy assumed.
#
# 2026-08-27: added Genially's domains (view.genially.com serves both its
# published-viewer AND the "Embed a website" element's parent frame when
# playing/editing an interactive that embeds one of these pages; app.
# genially.com is the editor's own live-preview canvas, which embeds the
# same way while authoring - both covered by the *.genially.com wildcard;
# genial.ly is Genially's short-link/marketing domain, added defensively
# since some published links resolve under it) so any of this bundle's
# pages (IntelliVue, HemoSphere, pacemaker, console, etc.) can be embedded
# as a Genially "Embed a website" element. Confirmed via Iframely's public
# Genially embed reference (iframely.com/domains/genially) which Genially's
# own support docs weren't reachable to cross-check at the time - if a
# custom Genially domain (a paid-tier vanity domain feature) is ever used
# instead, that specific domain needs adding here too.

[build]
  publish = "."

# 2026-08-27: the three device files with mixed-case names were renamed to
# all-lowercase (devices/intellivue/IntelliVue_Sim_Monitor.html etc.) - a
# mixed-case filename made Netlify's own automatic pretty-URL rewriting
# (lowercases + strips .html) 301-redirect every request through an extra
# hop, which was harmless for real browsers (redirects are followed
# transparently) but broke naive tooling that doesn't follow redirects.
# These explicit redirects keep any link/QR code/bookmark already shared
# using the OLD mixed-case names working, permanently, rather than 404ing
# the moment someone reuses a link handed out before this rename.
[[redirects]]
  from = "/devices/intellivue/IntelliVue_Sim_Monitor.html"
  to = "/devices/intellivue/intellivue_sim_monitor.html"
  status = 301
  force = true
[[redirects]]
  from = "/devices/intellivue/IntelliVue_Tachy_DualScreen.html"
  to = "/devices/intellivue/intellivue_tachy_dualscreen.html"
  status = 301
  force = true
[[redirects]]
  from = "/devices/hemosphere-alta/HemoSphere_Alta_Sim.html"
  to = "/devices/hemosphere-alta/hemosphere_alta_sim.html"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    # Allow this site to be embedded inside SharePoint Online / Teams pages
    # (and itself). Direct access to the URL is unaffected.
    Content-Security-Policy = "frame-ancestors 'self' https://*.sharepoint.com https://*.sharepoint.us https://*.microsoftonline.com https://teams.microsoft.com https://*.genially.com https://*.genial.ly"
